name: Backend CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dailyfunding
          POSTGRES_USER: dailyfunding
          POSTGRES_PASSWORD: dailyfunding
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U dailyfunding"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_NAME: dailyfunding
      DB_USER: dailyfunding
      DB_PASSWORD: dailyfunding
      CELERY_EAGER: "1"
      ALLOWED_HOSTS: "*"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
      - run: python manage.py spectacular --format openapi-json --file schema.json --validate
      - uses: actions/upload-artifact@v4
        with:
          name: schema
          path: schema.json
          if-no-files-found: error
