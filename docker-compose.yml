services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dailyfunding
      POSTGRES_USER: dailyfunding
      POSTGRES_PASSWORD: dailyfunding
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_USER: dailyfunding
      DB_PASSWORD: dailyfunding
      REDIS_URL: redis://redis:6379/0
      MOCKBANK_API_BASE: http://api:8000
      CELERY_EAGER: "0"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: celery -A config worker -l info
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_USER: dailyfunding
      DB_PASSWORD: dailyfunding
      REDIS_URL: redis://redis:6379/0
      MOCKBANK_API_BASE: http://api:8000
      CELERY_EAGER: "0"
    volumes:
      - .:/app
    depends_on:
      - api
      - redis

  beat:
    build: .
    command: celery -A config beat -l info
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_USER: dailyfunding
      DB_PASSWORD: dailyfunding
      REDIS_URL: redis://redis:6379/0
      MOCKBANK_API_BASE: http://api:8000
      CELERY_EAGER: "0"
    volumes:
      - .:/app
    depends_on:
      - redis

volumes:
  pgdata:
