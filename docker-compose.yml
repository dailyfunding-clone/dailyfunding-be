services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dailyfunding
      POSTGRES_USER: dailyfunding
      POSTGRES_PASSWORD: dailyfunding
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailyfunding"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_USER: dailyfunding
      DB_PASSWORD: dailyfunding
      REDIS_URL: redis://redis:6379/0
      MOCKBANK_API_BASE: http://api:8000
      CELERY_EAGER: "0"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A config worker -l info
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_USER: dailyfunding
      DB_PASSWORD: dailyfunding
      REDIS_URL: redis://redis:6379/0
      MOCKBANK_API_BASE: http://api:8000
      CELERY_EAGER: "0"
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A config beat -l info
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_USER: dailyfunding
      DB_PASSWORD: dailyfunding
      REDIS_URL: redis://redis:6379/0
      MOCKBANK_API_BASE: http://api:8000
      CELERY_EAGER: "0"
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
